name: verify
on:
  push:
  schedule:
    - cron: '17 13 * * *'    # daily — catches the Bridge preview moving under us
  workflow_dispatch:
jobs:
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Drive the live Bridge end to end
        run: node live-e2e.mjs
