name: verify
on:
  push:
  schedule:
    - cron: '17 13 * * *'    # daily — catches the Bridge preview moving under us
  workflow_dispatch:
permissions:
  contents: read              # least privilege — this workflow only reads the repo
jobs:
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline suite (deterministic — no network, no keys)
        run: node --test server/*.test.mjs *.test.mjs
      - name: Guards are load-bearing (mutation harness)
        run: node server/verify-guards.mjs
      - name: Drive the live Bridge end to end
        run: node live-e2e.mjs
